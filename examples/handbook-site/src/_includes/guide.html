+++
layout = "base.html"
+++
<div class="guide-shell">
  <aside class="sidebar">
    <nav aria-label="Guide pages">
      <p class="sidebar-label">Guide</p>
      <a href="{{ "/guide/" | url }}">Overview</a>
      {% for entry in collections.pages | children_of: "/guide/" | sort_by: "order" %}
      <a href="{{ entry.url | url }}">{{ entry.title }}</a>
      {% endfor %}
    </nav>
  </aside>
  <article class="guide-content">{{ content | safe }}</article>
</div>
