<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="stylesheet" href="{{ "/assets/css/site.css" | url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }} feed" href="{{ "/atom.xml" | url }}">
</head>
<body>
  <header class="site-header">
    <a class="site-name" href="{{ "/" | url }}">{{ site.title }}</a>
    <nav aria-label="Main navigation">
      <a href="{{ "/archive/" | url }}">Archive</a>
      <a href="{{ "/topics/notes/" | url }}">Notes</a>
      <a href="{{ "/about/" | url }}">About</a>
    </nav>
  </header>
  <main>{{ content | safe }}</main>
  <footer><p>{{ site.description }}</p></footer>
</body>
</html>
