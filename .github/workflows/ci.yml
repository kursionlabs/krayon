name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Krayon
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: krayon
          persist-credentials: false

      - name: Check out Kursal main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kursionlabs/kursal
          ref: main
          path: kursal
          token: ${{ secrets.KURSAL_REPO_TOKEN || github.token }}
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Bootstrap Kursal
        working-directory: kursal
        run: scripts/bootstrap.sh

      - name: Build Krayon
        working-directory: krayon
        run: |
          mkdir -p bin
          ../kursal/bin/kursal build krayon -o bin/krayon

      - name: Run integration tests
        working-directory: krayon
        run: python3 tests/integration.py

      - name: Test stdlib shim
        working-directory: krayon
        run: |
          ../kursal/bin/kursal build tests/shim -o bin/shim-test
          test_root=$(mktemp -d)
          trap 'rm -rf "$test_root"' EXIT
          mkdir "$test_root/target"
          : > "$test_root/file"
          ln -s target "$test_root/link"
          ln -s file "$test_root/file-link"
          bin/shim-test "$test_root"
          test -d "$test_root/nested/one/two"
          test -d "$test_root/target/child"
