<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="doc-root" content="{{ "/api/" | url }}">
  <title>{{ page.title }} · Krayon Docs</title>
  <script>try{const saved=localStorage.getItem('krayon-docs-theme');document.documentElement.dataset.theme=saved==='light'||saved==='dark'?saved:(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){document.documentElement.dataset.theme=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}</script>
  <link rel="stylesheet" href="{{ "/assets/css/docs.css" | url }}">
  <link rel="stylesheet" href="{{ "/assets/api/site.css" | url }}">
  <script defer src="{{ "/assets/js/theme.js" | url }}"></script>
  <script defer src="{{ "/assets/api/search.js" | url }}"></script>
  <script defer src="{{ "/assets/api/nav.js" | url }}"></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div class="site-shell api-shell">
    <header class="site-header api-header">
      <a class="site-name" href="{{ "/api/" | url }}">Krayon <span>Docs</span></a>
      <div class="search" role="search">
        <label class="visually-hidden" for="doc-search">Search the API reference</label>
        <input id="doc-search" class="search-input" type="search" placeholder="Search API (press /)" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="doc-search-results" aria-autocomplete="list">
        <ul id="doc-search-results" class="search-results" role="listbox" aria-label="Search results" hidden></ul>
        <p class="visually-hidden" id="doc-search-status" role="status" aria-live="polite"></p>
      </div>
      <div class="header-actions"><a class="guide-link" href="{{ "/" | url }}">Guides</a><span class="api-label">API reference</span><button class="theme-toggle" type="button" hidden><span class="theme-toggle-icon" aria-hidden="true"></span><span class="theme-toggle-label">Theme</span></button></div>
    </header>
    {{ content | safe }}
    <footer class="site-footer">Krayon generates files for any static host.</footer>
  </div>
</body>
</html>
