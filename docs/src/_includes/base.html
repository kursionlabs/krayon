<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="stylesheet" href="{{ "/assets/css/docs.css" | url }}">
</head>
<body>
  <header class="site-header">
    <a class="site-name" href="{{ "/" | url }}">Krayon</a>
    <nav aria-label="Documentation">
      <a href="{{ "/start/" | url }}">Start</a>
      <a href="{{ "/blog/" | url }}">Blog walkthrough</a>
      <a href="{{ "/configuration/" | url }}">Configuration</a>
      <a href="{{ "/templates/" | url }}">Templates</a>
      <a href="{{ "/cli/" | url }}">CLI</a>
    </nav>
  </header>
  <main>{{ content | safe }}</main>
  <footer><p>Krayon generates files for any static host.</p></footer>
</body>
</html>
